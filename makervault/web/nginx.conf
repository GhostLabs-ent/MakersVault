server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=30s;

  # Large model/zip uploads: nginx defaults to a 1 MB request body, which
  # rejects anything but toy files before it ever reaches the API.
  client_max_body_size 4096m;
  client_body_timeout 600s;
  # Stream request bodies straight to the API instead of buffering the whole
  # file to disk in nginx first.
  proxy_request_buffering off;
  proxy_send_timeout 600s;
  proxy_read_timeout 600s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  # A location that declares its own add_header drops every server-level
  # add_header, so the snippet is included again in each such location below.
  include /etc/nginx/security-headers.conf;

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/security-headers.conf;
  }

  location /img/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800" always;
    include /etc/nginx/security-headers.conf;
  }

  location = /runtime-config.js {
    try_files $uri =404;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security-headers.conf;
  }

  location /api/ {
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/security-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
  }
}
