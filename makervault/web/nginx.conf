map $uri $makersvault_cache_control {
  default "no-cache";
  ~^/assets/ "public, max-age=31536000, immutable";
  ~^/img/ "public, max-age=604800";
  =/runtime-config.js "no-store";
  ~^/api/ "";
}

server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 ipv6=off valid=30s;
  client_max_body_size __MAKERSVAULT_PROXY_BODY_MAX_MB__m;

  add_header Cache-Control $makersvault_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: __MAKERSVAULT_CSP_API_SOURCE__; connect-src 'self' __MAKERSVAULT_CSP_API_SOURCE__; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
  add_header X-Frame-Options "DENY" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

  location /assets/ {
    try_files $uri =404;
  }

  location /img/ {
    try_files $uri =404;
  }

  location = /runtime-config.js {
    try_files $uri =404;
  }

  location /api/ {
    set $api_upstream http://api:8000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
