services:
  api:
    image: ${API_IMAGE:-shotgunwilly555/makersvault-api:v5.1.0}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Account/ownership setup and trusted offline recovery only. The entrypoint
    # clears every capability set before starting the application.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - SETPCAP
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - MAKERSVAULT_ENV=production
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:?AUTH_PASSWORD is required; run ./scripts/setup-env.sh}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required; run ./scripts/setup-env.sh}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN:-}
      - WEBAUTHN_RP_NAME=${WEBAUTHN_RP_NAME:-MakersVault}
      - SESSION_IDLE_TTL=${SESSION_IDLE_TTL:-43200}
      - SESSION_ABSOLUTE_TTL=${SESSION_ABSOLUTE_TTL:-604800}
      - SESSION_TOUCH_INTERVAL=${SESSION_TOUCH_INTERVAL:-300}
      - SESSION_MAX_ACTIVE=${SESSION_MAX_ACTIVE:-20}
      - FILE_MAX_MB=${FILE_MAX_MB:-${IMPORT_MAX_MB:-512}}
      - STORAGE_RESERVE_MB=${STORAGE_RESERVE_MB:-512}
      - ARCHIVE_MAX_ENTRIES=${ARCHIVE_MAX_ENTRIES:-10000}
      - ARCHIVE_MAX_SELECTED=${ARCHIVE_MAX_SELECTED:-1000}
      - ARCHIVE_MAX_EXPANDED_MB=${ARCHIVE_MAX_EXPANDED_MB:-2048}
      - ARCHIVE_MAX_RATIO=${ARCHIVE_MAX_RATIO:-200}
      - ARCHIVE_METADATA_MAX_MB=${ARCHIVE_METADATA_MAX_MB:-16}
      - IMAGE_MAX_PIXELS=${IMAGE_MAX_PIXELS:-64000000}
      - GENERATED_THUMBNAIL_MAX_MB=${GENERATED_THUMBNAIL_MAX_MB:-8}
      - PREVIEW_POLICY_VERSION=${PREVIEW_POLICY_VERSION:-1}
      - PREVIEW_AUTO_MAX_MB=${PREVIEW_AUTO_MAX_MB:-16}
      - PREVIEW_AUTO_MAX_TRIANGLES=${PREVIEW_AUTO_MAX_TRIANGLES:-100000}
      - PREVIEW_AUTO_3MF_EXPANDED_MB=${PREVIEW_AUTO_3MF_EXPANDED_MB:-64}
      - PREVIEW_AUTO_3MF_ENTRIES=${PREVIEW_AUTO_3MF_ENTRIES:-256}
      - PREVIEW_AUTO_MEMORY_MB=${PREVIEW_AUTO_MEMORY_MB:-128}
      - PREVIEW_AUTO_TIMEOUT_SECONDS=${PREVIEW_AUTO_TIMEOUT_SECONDS:-10}
      - PREVIEW_AUTO_QUEUE=${PREVIEW_AUTO_QUEUE:-8}
      - PREVIEW_DETAIL_MAX_MB=${PREVIEW_DETAIL_MAX_MB:-64}
      - PREVIEW_DETAIL_MAX_TRIANGLES=${PREVIEW_DETAIL_MAX_TRIANGLES:-500000}
      - PREVIEW_DETAIL_3MF_EXPANDED_MB=${PREVIEW_DETAIL_3MF_EXPANDED_MB:-256}
      - PREVIEW_DETAIL_3MF_ENTRIES=${PREVIEW_DETAIL_3MF_ENTRIES:-1000}
      - PREVIEW_DETAIL_MEMORY_MB=${PREVIEW_DETAIL_MEMORY_MB:-256}
      - PREVIEW_DETAIL_TIMEOUT_SECONDS=${PREVIEW_DETAIL_TIMEOUT_SECONDS:-30}
      - IMPORT_MAX_REDIRECTS=${IMPORT_MAX_REDIRECTS:-5}
      - FILE_STORAGE=/app/storage
      - DB_URL=sqlite:////app/data/app.db
      - PUBLIC_URL=${PUBLIC_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - TRUSTED_HOSTS=${TRUSTED_HOSTS:-}
      - IMPORT_MOUNT_PATH=${IMPORT_MOUNT_PATH:-}
      - IMPORT_MOUNT_EXTS=${IMPORT_MOUNT_EXTS:-stl,3mf,step,stp,obj,svg,png,jpg,jpeg,webp,bmp,lbrn,lbrn2,zip}
      - IMPORT_MOUNT_INCLUDE_HIDDEN=${IMPORT_MOUNT_INCLUDE_HIDDEN:-false}
      - IMPORT_MOUNT_ON_STARTUP=${IMPORT_MOUNT_ON_STARTUP:-false}
      - IMPORT_MOUNT_COPY=${IMPORT_MOUNT_COPY:-true}
    volumes:
      - makersvault_storage:/app/storage
      - makersvault_db:/app/data
      - ${IMPORT_MOUNT_PATH_HOST:-./imports}:/imports:ro
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    image: ${WEB_IMAGE:-shotgunwilly555/makersvault-web:v5.1.0}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - FILE_MAX_MB=${FILE_MAX_MB:-${IMPORT_MAX_MB:-512}}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  makersvault_storage:
  makersvault_db:
