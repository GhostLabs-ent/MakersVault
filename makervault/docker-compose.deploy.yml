services:
  api:
    image: ${API_IMAGE:-shotgunwilly555/makersvault-api:latest}
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # `recursive` opts into a full data-tree ownership repair at entrypoint.
      - CHOWN_MODE=${CHOWN_MODE:-minimal}
      # The API refuses to start while these are the published sample values,
      # so a deployment without a real .env fails loudly instead of serving a
      # publicly-known login.
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-super-secret}
      - AUTH_SECRET=${AUTH_SECRET:-changeme-secret}
      # AUTH_TOKEN_TTL is deprecated and ignored (a no-op since the access/refresh
      # split), so it is deliberately not forwarded. An old .env that still sets
      # it still starts, but the value does nothing.
      - AUTH_ACCESS_TOKEN_TTL=${AUTH_ACCESS_TOKEN_TTL:-900}
      - AUTH_REFRESH_TTL_SECONDS=${AUTH_REFRESH_TTL_SECONDS:-2592000}
      - AUTH_ALLOW_INSECURE_DEFAULTS=${AUTH_ALLOW_INSECURE_DEFAULTS:-false}
      - FILE_STORAGE=/app/storage
      - DB_URL=sqlite:////app/data/app.db
      - PUBLIC_URL=${PUBLIC_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Upload and remote-import caps. ASSET_FILE_MAX_MB is forwarded empty on
      # purpose: config.env_int then falls through to IMPORT_MAX_MB, so it keeps
      # following an operator's import cap. The cap in force is the smaller of
      # the two.
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-4096}
      - IMPORT_MAX_MB=${IMPORT_MAX_MB:-512}
      - IMPORT_ZIP_MAX_MB=${IMPORT_ZIP_MAX_MB:-2048}
      - IMPORT_TIMEOUT_SECONDS=${IMPORT_TIMEOUT_SECONDS:-30}
      - IMPORT_MAX_REDIRECTS=${IMPORT_MAX_REDIRECTS:-5}
      - IMPORT_HTML_MAX_KB=${IMPORT_HTML_MAX_KB:-4096}
      - ASSET_FILE_MAX_MB=${ASSET_FILE_MAX_MB:-}
      - ASSET_FILE_TOTAL_MAX_MB=${ASSET_FILE_TOTAL_MAX_MB:-2048}
      - ASSET_FILE_MAX_COUNT=${ASSET_FILE_MAX_COUNT:-50}
      # Optional server-side source credentials. A browser-supplied value wins
      # and is never persisted.
      - MAKERWORLD_COOKIE=${MAKERWORLD_COOKIE:-}
      - THINGIVERSE_COOKIE=${THINGIVERSE_COOKIE:-}
      - IMPORT_MOUNT_PATH=${IMPORT_MOUNT_PATH:-}
      - IMPORT_MOUNT_EXTS=${IMPORT_MOUNT_EXTS:-stl,3mf,step,stp,obj,svg,png,jpg,jpeg,webp,bmp,lbrn,lbrn2,zip}
      - IMPORT_MOUNT_INCLUDE_HIDDEN=${IMPORT_MOUNT_INCLUDE_HIDDEN:-false}
      - IMPORT_MOUNT_ON_STARTUP=${IMPORT_MOUNT_ON_STARTUP:-false}
      - IMPORT_MOUNT_COPY=${IMPORT_MOUNT_COPY:-true}
      # Login throttling. Repeated failed logins lock the single admin account
      # out with escalating backoff.
      - LOGIN_THROTTLE_ENABLED=${LOGIN_THROTTLE_ENABLED:-true}
      - LOGIN_MAX_FAILURES=${LOGIN_MAX_FAILURES:-5}
      - LOGIN_FAILURE_WINDOW_SECONDS=${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      - LOGIN_LOCKOUT_SECONDS=${LOGIN_LOCKOUT_SECONDS:-300}
      - LOGIN_MAX_LOCKOUT_SECONDS=${LOGIN_MAX_LOCKOUT_SECONDS:-3600}
      # Pre-operation snapshots for the three destructive operations. `warn`
      # proceeds without one and says so; `strict` refuses only when
      # SNAPSHOT_REQUIRE_CAPABILITY is true, because a volume with no snapshot
      # method (ext4, tmpfs) must still allow Empty trash.
      - SNAPSHOT_POLICY_PREDELETE=${SNAPSHOT_POLICY_PREDELETE:-warn}
      - SNAPSHOT_POLICY_PREPURGE=${SNAPSHOT_POLICY_PREPURGE:-strict}
      - SNAPSHOT_POLICY_PREBULK=${SNAPSHOT_POLICY_PREBULK:-strict}
      - SNAPSHOT_REQUIRE_CAPABILITY=${SNAPSHOT_REQUIRE_CAPABILITY:-false}
    volumes:
      - makersvault_storage:/app/storage
      - makersvault_db:/app/data
      - ${IMPORT_MOUNT_PATH_HOST:-./imports}:/imports:ro
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    image: ${WEB_IMAGE:-shotgunwilly555/makersvault-web:latest}
    restart: unless-stopped
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Security headers emitted by the bundled Nginx. Empty means "use the
      # built-in default"; the literal value `off` omits that header.
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED:-true}
      - SECURITY_HEADERS_HSTS=${SECURITY_HEADERS_HSTS:-}
      - SECURITY_HEADERS_CSP=${SECURITY_HEADERS_CSP:-}
      - SECURITY_HEADERS_REFERRER_POLICY=${SECURITY_HEADERS_REFERRER_POLICY:-}
      - SECURITY_HEADERS_FRAME_OPTIONS=${SECURITY_HEADERS_FRAME_OPTIONS:-}
      - SECURITY_HEADERS_PERMISSIONS_POLICY=${SECURITY_HEADERS_PERMISSIONS_POLICY:-}
      - SECURITY_HEADERS_CONTENT_TYPE_OPTIONS=${SECURITY_HEADERS_CONTENT_TYPE_OPTIONS:-}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  makersvault_storage:
  makersvault_db:
