# Gate 2 verification-only overlay. Runtime content is isolated in
# project-scoped named volumes and removed by preview-benchmark.sh.
services:
  api:
    volumes:
      - makersvault_preview_benchmark_storage:/app/storage
      - makersvault_preview_benchmark_db:/app/data
      - ./api:/app

volumes:
  makersvault_preview_benchmark_storage:
  makersvault_preview_benchmark_db:
