name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify API and migrations
        run: make verify-api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify web types, tests, and production build
        run: make verify-web

  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bridge tests and build
        run: make verify-bridge

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose manifests
        run: make verify-compose
      - name: Run container smoke test
        run: make verify-smoke
      - name: Verify browser passkey ceremonies
        run: make verify-passkeys
      - name: Verify release identity and publication contract
        run: make verify-release
