version: 2
updates:
  - package-ecosystem: pip
    directory: /makervault/api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /makervault/web
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /makervault/slicer-bridge
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /makervault/api
    schedule:
      interval: weekly
  # Floats `N-alpine` on a supported Node LTS major. Dependabot only proposes
  # same-precision tags, so it proposes newer-major float tags, never 24.x
  # patch PRs (those arrive by tag re-resolution at build time). Node 25 was
  # the last non-LTS line and is EOL; from 27 every annual major is LTS, so a
  # major PR is an LTS: the reviewed accept-or-reject decision.
  - package-ecosystem: docker
    directory: /makervault/web
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
