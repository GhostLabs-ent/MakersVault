version: 2
updates:
  - package-ecosystem: pip
    directory: /makervault/api
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /makervault/web
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /makervault/slicer-bridge
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /makervault/api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /makervault/web
    schedule:
      interval: weekly
    ignore:
      # Node base-image majors are non-LTS more often than not (25 was
      # rejected outright on Mf-9azr), so they arrive as a deliberate ticket
      # rather than an automatic PR. Minor/patch bumps still come through.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
