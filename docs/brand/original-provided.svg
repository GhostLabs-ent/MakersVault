<svg xmlns="http://w3.org" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Magical Background -->
    <radialGradient id="space-bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#140727" />
      <stop offset="60%" stop-color="#0b0316" />
      <stop offset="100%" stop-color="#040108" />
    </radialGradient>

    <!-- Arcane Violet Laser Lines -->
    <linearGradient id="arcane-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b76eff" />
      <stop offset="50%" stop-color="#7b2cbf" />
      <stop offset="100%" stop-color="#4a157d" />
    </linearGradient>

    <!-- Eldritch Cyan/Teal Intersection Lines -->
    <linearGradient id="cyan-glow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#4895ef" />
    </linearGradient>

    <!-- Fine Gold Trim Gradients -->
    <linearGradient id="gold-wire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059" />
      <stop offset="50%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <!-- Vector Line Glow (No textures, purely clean vector illumination) -->
    <filter id="clean-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="800" fill="url(#space-bg)" />

  <!-- MAIN GEOMETRIC GRAPHICS LAYER -->
  <g transform="translate(0, -35)">
    
    <!-- LEVEL 1: Outer Celestial Ring Mapping -->
    <circle cx="400" cy="380" r="310" fill="none" stroke="url(#arcane-purple)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4, 8" />
    <circle cx="400" cy="380" r="295" fill="none" stroke="url(#gold-wire)" stroke-width="1" stroke-opacity="0.2" />

    <!-- LEVEL 2: Dense Primary Double Hexagon (The Archival Framework) -->
    <!-- Primary Hexagon -->
    <polygon points="400,70 668,225 668,535 400,690 132,535 132,225" fill="none" stroke="url(#arcane-purple)" stroke-width="4" stroke-linejoin="round" />
    <!-- Rotated Intersecting Hexagon Layer -->
    <polygon points="400,100 642,240 642,520 400,660 158,520 158,240" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" stroke-opacity="0.5" stroke-linejoin="round" />

    <!-- LEVEL 3: Complex Geometric Matrix Lines (Sacred Geometry / STL Wireframe Wire intersections) -->
    <!-- Corner to Corner Spoke Grid -->
    <line x1="400" y1="70" x2="400" y2="690" stroke="url(#arcane-purple)" stroke-width="1" stroke-opacity="0.4" />
    <line x1="132" y1="225" x2="668" y2="535" stroke="url(#arcane-purple)" stroke-width="1" stroke-opacity="0.4" />
    <line x1="132" y1="535" x2="668" y2="225" stroke="url(#arcane-purple)" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Star Facet Webbing (Cross-stitching vertices) -->
    <polygon points="400,70 668,535 132,535" fill="none" stroke="url(#cyan-glow)" stroke-width="0.75" stroke-opacity="0.3" />
    <polygon points="400,690 132,225 668,225" fill="none" stroke="url(#cyan-glow)" stroke-width="0.75" stroke-opacity="0.3" />
    
    <!-- Concentric Inner Astrolabe Hexagons -->
    <polygon points="400,140 608,260 608,500 400,620 192,500 192,260" fill="none" stroke="url(#gold-wire)" stroke-width="1" stroke-opacity="0.4" />
    <polygon points="400,180 573,280 573,480 400,580 227,480 227,280" fill="none" stroke="url(#arcane-purple)" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="15, 5" />

    <!-- LEVEL 4: The Central "C" Magic Vault Facets -->
    <!-- Backing Structure & Dark Facet Creases -->
    <g stroke="url(#gold-wire)" stroke-width="1.5" stroke-linejoin="round">
      <!-- Upper C Projection -->
      <polygon points="280,310 400,220 520,310 470,350 400,300 330,350" fill="#200a3b" />
      <!-- Vertical Spine Base -->
      <polygon points="280,310 280,450 330,410 330,350" fill="#2d1254" />
      <!-- Lower C Projection -->
      <polygon points="280,450 400,540 520,450 470,410 400,460 330,410" fill="#200a3b" />
      
      <!-- LEVEL 5: Hyper-Detailed Crystal Mesh Faces (The Core Curio Object) -->
      <!-- High-intensity vector segments catching the 'light' -->
      <polygon points="400,220 520,310 470,350 400,300" fill="url(#arcane-purple)" stroke="url(#cyan-glow)" stroke-width="1" filter="url(#clean-glow)" />
      <polygon points="400,300 470,350 400,390 330,350" fill="#5a189a" stroke="url(#arcane-purple)" stroke-width="1" />
      <polygon points="280,310 400,220 400,300 330,350" fill="#3c096c" stroke="url(#cyan-glow)" stroke-width="1" />
      
      <polygon points="280,310 330,350 330,410 280,450" fill="url(#arcane-purple)" stroke="url(#gold-wire)" stroke-width="1.25" />
      
      <polygon points="280,450 400,540 400,460 330,410" fill="#3c096c" stroke="url(#cyan-glow)" stroke-width="1" />
      <polygon points="400,460 470,410 400,370 330,410" fill="#5a189a" stroke="url(#arcane-purple)" stroke-width="1" />
      <polygon points="400,540 520,450 470,410 400,460" fill="url(#arcane-purple)" stroke="url(#cyan-glow)" stroke-width="1" filter="url(#clean-glow)" />
    </g>

    <!-- Geometric Node Points (Tiny structural vertices dots for STL data feel) -->
    <circle cx="400" cy="70" r="4" fill="url(#gold-wire)" />
    <circle cx="668" cy="225" r="4" fill="url(#gold-wire)" />
    <circle cx="668" cy="535" r="4" fill="url(#gold-wire)" />
    <circle cx="400" cy="690" r="4" fill="url(#gold-wire)" />
    <circle cx="132" cy="535" r="4" fill="url(#gold-wire)" />
    <circle cx="132" cy="225" r="4" fill="url(#gold-wire)" />
    
    <circle cx="400" cy="220" r="3" fill="#4cc9f0" />
    <circle cx="520" cy="310" r="3" fill="#4cc9f0" />
    <circle cx="520" cy="450" r="3" fill="#4cc9f0" />
    <circle cx="400" cy="540" r="3" fill="#4cc9f0" />
    <circle cx="280" cy="450" r="3" fill="#4cc9f0" />
    <circle cx="280" cy="310" r="3" fill="#4cc9f0" />
  </g>

  <!-- TYPOGRAPHY LAYOUT SECTION -->
  <!-- Main Title: Arcane Serif Branding -->
  <text x="400" y="705" 
        font-family="'Cinzel', 'Trajan Pro', 'Times New Roman', serif" 
        font-size="48" 
        font-weight="700" 
        fill="url(#gold-wire)" 
        text-anchor="middle" 
        letter-spacing="8">CURIARIUM</text>
        
  <!-- Subtitle: Clean Technical Dev Font -->
  <text x="400" y="750" 
        font-family="'Montserrat', 'Fira Code', 'Arial', sans-serif" 
        font-size="16" 
        font-weight="600"
        fill="#4cc9f0" 
        text-anchor="middle" 
        letter-spacing="10" 
        opacity="0.9">STL LIBRARY ARCHIVE</text>
</svg>

